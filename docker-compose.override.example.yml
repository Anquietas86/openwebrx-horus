# docker-compose.override.example.yml
#
# Drop-in override for an existing OpenWebRX+ docker-compose setup.
# Mounts the plugin repo and runs the installer on every container start,
# so the Python patches and horusdemodlib survive image updates automatically.
#
# Usage:
#   1. Clone this repo next to your docker-compose.yml:
#        git clone https://github.com/Anquietas86/openwebrx-horus.git
#
#   2. Copy this file:
#        cp openwebrx-horus/docker-compose.override.example.yml docker-compose.override.yml
#
#   3. Edit the service name below to match your docker-compose.yml
#      (e.g. "owrx", "openwebrx", etc.), then:
#        docker compose up -d
#
# To update the plugin later: git -C openwebrx-horus pull && docker compose restart
#
# docker compose merges this with your existing docker-compose.yml automatically.

services:
  # Change this to match your service name in docker-compose.yml
  owrx:
    volumes:
      # Mount the plugin repo into the container (read-only)
      - ./openwebrx-horus:/opt/openwebrx-horus:ro

    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        # Same installer as install.sh / install-docker.sh. If it fails,
        # OpenWebRX still starts (without Horus) and the error is in the log.
        python3 /opt/openwebrx-horus/horus_patch.py install --pip /usr/lib/python3/dist-packages \
          || echo "[openwebrx-horus] INSTALL FAILED - Horus decoding is unavailable, see above" >&2

        # Hand off to the real entrypoint (s6 process supervisor)
        exec /init
